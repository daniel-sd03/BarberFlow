# ==========================================
# 1. DATABASE & ORM (H2 In-Memory)
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# ==========================================
# 2. FLYWAY
# ==========================================
spring.flyway.enabled=false

# ==========================================
# 3. CACHE & REDIS
# ==========================================
spring.cache.type=none
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# 4. SECURITY & AUTH
# ==========================================
api.security.token.secret=test-secret-key
spring.security.oauth2.client.registration.google.client-id=fake-client-id
spring.security.oauth2.client.registration.google.client-secret=fake-client-secret

# ==========================================
# 5. EMAIL
# ==========================================
MAIL_FROM=teste@teste.com
app.mail.from=teste@teste.com