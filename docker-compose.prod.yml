services:
  api:
    image: ${DOCKER_IMAGE:-seu-usuario/clickfila-api:latest}
    container_name: clickFila_spring_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      # Database injection
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}

      # Redis config (fixed for container internal network)
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_CACHE_TYPE=redis

      # Security & External APIs injection
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}

      # Disables Spring's native Docker Compose integration in production
      - SPRING_DOCKER_COMPOSE_ENABLED=false


  redis:
    image: redis:7
    container_name: clickFila_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  alloy:
    image: grafana/alloy:latest
    container_name: clickfila-alloy
    restart: unless-stopped
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
    environment:
      - GRAFANA_URL=${GRAFANA_URL}
      - GRAFANA_USERNAME=${GRAFANA_USERNAME}
      - GRAFANA_TOKEN=${GRAFANA_TOKEN}
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - api