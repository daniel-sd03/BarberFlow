name: CI/CD Pipeline - Test, Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/clickfila-api:latest .

      - name: Push Docker image to Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/clickfila-api:latest

  deploy-to-ec2:
    name: Deploy to EC2
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids "i-010b4e9e30c70f46b" \
            --document-name "DeployClickFilaAPI" \
            --parameters "EnvContent='
              DB_URL=${{ secrets.DB_URL }}
              DB_USER=${{ secrets.DB_USER }}
              DB_PASS=${{ secrets.DB_PASS }}
              JWT_SECRET=${{ secrets.JWT_SECRET }}
              GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
              GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
              RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
              MAIL_FROM=${{ secrets.MAIL_FROM }}
              GRAFANA_URL=${{ secrets.GRAFANA_URL }}
              GRAFANA_USERNAME=${{ secrets.GRAFANA_USERNAME }}
              GRAFANA_TOKEN=${{ secrets.GRAFANA_TOKEN }}
              CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
              FRONTEND_URL=${{ secrets.FRONTEND_URL }}
              COOKIE_DOMAIN=${{ secrets.COOKIE_DOMAIN }}
              COOKIE_SECURE=${{ secrets.COOKIE_SECURE }}
            '"